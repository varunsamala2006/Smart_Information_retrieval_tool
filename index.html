<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retrieval Tool</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Retrieval Tool </h1>

        <p>Generate powerful search queries instantly</p>

        <div class="search-box">

            <input
                type="text"
                id="keyword"
                placeholder="Enter keyword..."
            >

            <button onclick="generateDorks()">
                Generate
            </button>

        </div>

        <div class="results" id="results"></div>

        <div class="footer">
            Smart search • Fast results • Clean UI
        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
